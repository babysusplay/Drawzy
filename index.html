<style>
  /* Clean top navigation: only brand + polished profile controls. */
  .topbar{height:66px;padding:0 16px;border-radius:18px;background:rgba(16,19,41,.88)}
  .brand{gap:10px}
  .brand-mark{width:40px;height:40px;border-radius:13px}
  .brand-name{font-size:21px;font-weight:950;letter-spacing:1px}

  .profile-pill{height:42px;padding:0 12px 0 9px;border:1px solid rgba(124,92,246,.38);background:linear-gradient(135deg,rgba(34,40,82,.95),rgba(20,24,52,.95));border-radius:13px;color:#fff;font-weight:850;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}

  .profile-icon{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:rgba(124,92,246,.18);font-size:13px}
  .profile-chevron{opacity:.65;font-size:15px;margin-left:1px}
  .avatar-btn{width:42px;height:42px;border-radius:13px;border:1px solid rgba(251,191,36,.38);background:linear-gradient(135deg,#ffd166,#ff8a65);box-shadow:0 8px 24px rgba(255,139,88,.2);font-size:21px;transition:.18s transform,.18s box-shadow}
  .avatar-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,139,88,.3)}

  /* Home character panel: compact, not a second game header. */
  .home-hero{grid-template-columns:minmax(0,1.2fr) minmax(230px,.55fr)}
  .home-character{padding:22px;display:flex;align-items:center;justify-content:center;gap:18px;min-height:100%;position:relative;overflow:hidden}

  /* Drawing view: prioritize the canvas. */

 const w=x2-x1,h=y2-y1;
 if(shape==='circle'){
   const rx=Math.abs(w)/2,ry=Math.abs(h)/2;ctx.ellipse(x1+w/2,y1+h/2,Math.max(2,rx),Math.max(2,ry),0,0,Math.PI*2);
 }else if(shape==='square'){
   const side=Math.max(Math.abs(w),Math.abs(h));ctx.rect(x1,y1,Math.sign(w||1)*side,Math.sign(h||1)*side);
 }else if(shape==='triangle'){
   ctx.moveTo(x1+w/2,y1);ctx.lineTo(x2,y2);ctx.lineTo(x1,y2);ctx.closePath();
 }
 ctx.stroke();
}

/* DRAWZY multiplayer foundation
   - Same-browser tabs/windows can sync through BroadcastChannel.
   - Cross-device matchmaking still requires the shared realtime backend.
   - The public-room hooks below are intentionally isolated for that integration.
*/
const DRAWZY_MP = {
  channel: null,
  roomCode: null,
  id: 'p_' + Math.random().toString(36).slice(2, 10),
  init(code){
    this.roomCode = code || null;
    if(!('BroadcastChannel' in window) || !code) return;
    try{
      this.channel = new BroadcastChannel('drawzy_room_' + code);
      this.channel.onmessage = e => {
        if(!e.data || e.data.sender === this.id) return;
        if(e.data.type === 'ping') this.post({type:'pong'});
      };
    }catch(_){}
  },
  post(data){
    if(this.channel) this.channel.postMessage({...data,sender:this.id});
  },
  close(){
    if(this.channel){ try{this.channel.close()}catch(_){} this.channel=null; }
  }
};
function makeRoomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function buildInviteUrl(code){
  const u=new URL(location.href);
  u.search='';
  u.hash='room='+encodeURIComponent(code);
  return u.toString();
}
function roomFromUrl(){
  const q=new URLSearchParams(location.search).get('room'); if(q)return q;
  const m=location.hash.match(/room=([^&]+)/); return m?decodeURIComponent(m[1]):null;
}

  if($('#skipTurn'))$('#skipTurn').onclick=skipCurrentTurn;
  $('#chatForm').onsubmit=e=>{e.preventDefault();sendGuess($('#guess').value);$('#guess').value=''};
  const colorMenu=$('#colorMenu'),shapeMenu=$('#shapeMenu');$('#colorBtn').onclick=()=>{colorMenu.classList.toggle('open');shapeMenu.classList.remove('open')};$('#shapeBtn').onclick=()=>{shapeMenu.classList.toggle('open');colorMenu.classList.remove('open')};
  document.querySelectorAll('#colorMenu .color').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;state.eraser=false;colorMenu.classList.remove('open')});
  $('#pencil').onclick=()=>setTool('pencil');$('#brush').onclick=()=>setTool('brush');$('#eraser').onclick=()=>{state.eraser=true;state.tool='brush';state.shape='none';$('#eraser').classList.add('active');$('#pencil').classList.remove('active');$('#brush').classList.remove('active')};
  document.querySelectorAll('#shapeMenu .shapePick').forEach(b=>b.onclick=()=>{state.eraser=false;state.shape=b.dataset.shape;shapeMenu.classList.remove('open')});
  $('#clear').onclick=()=>clearCanvas();$('#undo').onclick=()=>undoCanvas();$('#redo').onclick=()=>redoCanvas();$('#size').oninput=e=>state.size=+e.target.value;
  document.querySelectorAll('.word-choice').forEach(b=>b.onclick=()=>chooseWord(state.game.choices[+b.dataset.i]||state.game.choices[0]));
  if($('#likeBtn'))$('#likeBtn').onclick=()=>reactDrawing('like');if($('#dislikeBtn'))$('#dislikeBtn').onclick=()=>reactDrawing('dislike');
  if(hasChoices)startChoiceCountdown();
}
function setTool(tool){state.eraser=false;state.tool=tool;state.shape='none';['pencil','brush','eraser'].forEach(id=>{$('#'+id)?.classList.remove('active')});$('#'+tool)?.classList.add('active')}
function reactDrawing(type){
  // One reaction per player per drawing turn. Repeated clicks do nothing.
  if(state.game.myReaction)return;
  state.game.myReaction=type;
  if(type==='like'){SOUND.like();state.game.likes=(state.game.likes||0)+1;$('#likeBtn')?.classList.add('active-like')}
  else{SOUND.dislike();state.game.dislikes=(state.game.dislikes||0)+1;$('#dislikeBtn')?.classList.add('active-dislike')}
  $('#likeBtn')?.classList.add('reaction-locked');$('#dislikeBtn')?.classList.add('reaction-locked');
  if($('#likeCount'))$('#likeCount').textContent=state.game.likes;if($('#dislikeCount'))$('#dislikeCount').textContent=state.game.dislikes;
}
let choiceTimer=null;
function startChoiceCountdown(){
 clearTimeout(choiceTimer);let n=5;const el=$('#choiceCountdown');
 const tick=()=>{if(state.screen!=='game'||state.game.word){clearTimeout(choiceTimer);return}n--;if(el)el.textContent=n;if(n<=0){chooseWord(state.game.choices[0]);return}choiceTimer=setTimeout(tick,1000)};
 choiceTimer=setTimeout(tick,1000);
}
function skipCurrentTurn(){
 if(state.game.drawer!==state.name||!state.game.word)return;
 const p=state.players.find(x=>x.name===state.name);if(p)p.score=Math.max(0,p.score-25);
 addMessage('SYSTEM',`${state.name} skipped the drawing. −25 points`,'skip');
 updateRanking();clearTimeout(choiceTimer);clearInterval(timerId);nextTurn();
}


function startGame(){
  state.game={round:1,turn:0,drawer:null,word:'',choices:[],display:'',time:state.settings.drawTime,points:{},correct:[],drawing:false,started:true,finished:false,hintLevel:0,likes:0,dislikes:0,myReaction:null};
  state.players.forEach(p=>{p.score=0;p.correct=false});
  state.screen='game';pickDrawer();
}
function chooseWord(word){
  clearTimeout(choiceTimer);state.game.word=word;state.game.display=maskWord(word,0);state.game.hintLevel=0;state.game.time=state.settings.drawTime;render();
}
function pickDrawer(){
  clearTimeout(choiceTimer);
  const idx=state.game.turn%Math.max(1,state.players.length);state.game.drawer=state.players[idx]?.name||state.name;
  const pool=getWordPool();const count=Math.max(2,Math.min(4,Number(state.settings.wordCount)||3));
  const shuffled=[...pool].sort(()=>Math.random()-.5);state.game.choices=shuffled.slice(0,count);
  state.game.word='';state.game.hintLevel=0;state.game.display='';state.game.time=state.settings.drawTime;state.game.correct=[];state.game.drawing=false;state.game.likes=0;state.game.dislikes=0;state.game.myReaction=null;
  render();
}


function setupCanvas(){
 const c=$('#drawCanvas');if(!c)return;state.canvas=c;state.ctx=c.getContext('2d');let shapeSnapshot=null;
 const resize=()=>{const dpr=Math.max(1,devicePixelRatio||1),r=c.getBoundingClientRect();let old=null;if(c.width&&c.height){old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0)}c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));state.ctx=c.getContext('2d');state.ctx.setTransform(dpr,0,0,dpr,0,0);state.ctx.lineCap='round';state.ctx.lineJoin='round';state.ctx.fillStyle='#fff';state.ctx.fillRect(0,0,r.width,r.height);if(old)state.ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)};
 resize();state.history=[];state.future=[];try{state.history.push(state.ctx.getImageData(0,0,c.width,c.height))}catch{};window.addEventListener('resize',resize);
 const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 c.onpointerdown=e=>{if(state.screen==='game'&&(state.game.drawer!==state.name||!state.game.word))return;state.drawing=true;const p=pos(e);state.lastX=p.x;state.lastY=p.y;state.startX=p.x;state.startY=p.y;c.setPointerCapture(e.pointerId);if(state.shape&&state.shape!=='none')shapeSnapshot=state.ctx.getImageData(0,0,c.width,c.height)};
 c.onpointermove=e=>{if(!state.drawing)return;const p=pos(e),ctx=state.ctx;if(state.shape&&state.shape!=='none'){if(shapeSnapshot)ctx.putImageData(shapeSnapshot,0,0);drawShape(ctx,state.shape,state.startX,state.startY,p.x,p.y)}else{ctx.beginPath();ctx.moveTo(state.lastX,state.lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle=state.eraser?'#fff':state.color;ctx.lineWidth=state.tool==='brush'?Math.max(8,state.size*1.7):state.size;ctx.stroke();state.lastX=p.x;state.lastY=p.y}};
 const end=e=>{if(!state.drawing)return;const p=pos(e);if(state.shape&&state.shape!=='none'){if(shapeSnapshot)state.ctx.putImageData(shapeSnapshot,0,0);drawShape(state.ctx,state.shape,state.startX,state.startY,p.x,p.y);shapeSnapshot=null}state.drawing=false;pushCanvasHistory()};
 c.onpointerup=end;c.onpointercancel=end;
}


function clearCanvas(){if(!state.ctx||!state.canvas)return;const c=state.canvas,r=c.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);state.ctx.save();state.ctx.setTransform(dpr,0,0,dpr,0,0);state.ctx.fillStyle='#fff';state.ctx.fillRect(0,0,r.width,r.height);state.ctx.restore();state.history=[];state.future=[];try{state.history.push(state.ctx.getImageData(0,0,c.width,c.height))}catch{};}

 const resize=()=>{const dpr=Math.max(1,devicePixelRatio||1),r=c.getBoundingClientRect();let old=null;if(c.width&&c.height){old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0)}c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));state.ctx=c.getContext('2d');state.ctx.setTransform(dpr,0,0,dpr,0,0);state.ctx.lineCap='round';state.ctx.lineJoin='round';state.ctx.fillStyle='#fff';state.ctx.fillRect(0,0,r.width,r.height);if(old)state.ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)};
 resize();state.history=[];state.future=[];try{state.history.push(state.ctx.getImageData(0,0,c.width,c.height))}catch{};window.addEventListener('resize',resize);
 const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 c.onpointerdown=e=>{state.drawing=true;const p=pos(e);state.lastX=p.x;state.lastY=p.y;state.startX=p.x;state.startY=p.y;c.setPointerCapture(e.pointerId);if(state.shape&&state.shape!=='none')shapeSnapshot=state.ctx.getImageData(0,0,c.width,c.height)};
 c.onpointermove=e=>{if(!state.drawing)return;const p=pos(e),ctx=state.ctx;if(state.shape&&state.shape!=='none'){if(shapeSnapshot)ctx.putImageData(shapeSnapshot,0,0);drawShape(ctx,state.shape,state.startX,state.startY,p.x,p.y)}else{ctx.beginPath();ctx.moveTo(state.lastX,state.lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle=state.eraser?'#fff':state.color;ctx.lineWidth=state.tool==='brush'?Math.max(8,state.size*1.7):state.size;ctx.stroke();state.lastX=p.x;state.lastY=p.y}};
 const end=e=>{if(!state.drawing)return;const p=pos(e);if(state.shape&&state.shape!=='none'){if(shapeSnapshot)state.ctx.putImageData(shapeSnapshot,0,0);drawShape(state.ctx,state.shape,state.startX,state.startY,p.x,p.y);shapeSnapshot=null}state.drawing=false};c.onpointerup=end;c.onpointercancel=end;
 const cm=$('#lobbyColorMenu'),sm=$('#lobbyShapeMenu');$('#lobbyColorBtn').onclick=()=>{cm.classList.toggle('open');sm.classList.remove('open')};$('#lobbyShapeBtn').onclick=()=>{sm.classList.toggle('open');cm.classList.remove('open')};
 document.querySelectorAll('#lobbyColorMenu .color').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;state.eraser=false;cm.classList.remove('open')});
 $('#lobbyPencil').onclick=()=>setLobbyTool('pencil');$('#lobbyBrush').onclick=()=>setLobbyTool('brush');$('#lobbyEraser').onclick=()=>{state.eraser=true;state.tool='brush';state.shape='none';$('#lobbyEraser').classList.add('active');$('#lobbyPencil').classList.remove('active');$('#lobbyBrush').classList.remove('active')};
 document.querySelectorAll('#lobbyShapeMenu .shapePick').forEach(b=>b.onclick=()=>{state.eraser=false;state.shape=b.dataset.shape;sm.classList.remove('open')});
 $('#lobbyClear').onclick=()=>clearCanvas();$('#lobbySize').oninput=e=>state.size=+e.target.value;
}
function setLobbyTool(tool){state.eraser=false;state.tool=tool;state.shape='none';['lobbyPencil','lobbyBrush','lobbyEraser'].forEach(id=>$('#'+id)?.classList.remove('active'));$('#lobby'+tool.charAt(0).toUpperCase()+tool.slice(1))?.classList.add('active')}

document.addEventListener('pointerdown',()=>SOUND.ensure(),{once:true,passive:true});
</script>
