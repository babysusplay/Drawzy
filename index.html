<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drawzy — Draw. Guess. Repeat.</title>
<style>
:root{--blue:#315fae;--blue2:#244d96;--green:#45e52d;--panel:#0d4ba5;--white:#fff;--ink:#17213a;--muted:#65708a;--border:#cbd5e1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#2857a5}body{overflow-x:hidden}.bg{min-height:100vh;background-color:#2d5ca8;background-image:radial-gradient(circle at 15% 15%,rgba(255,255,255,.07) 0 2px,transparent 3px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.06) 0 2px,transparent 3px);background-size:46px 46px}.brand{text-align:center;color:#fff;font-size:clamp(46px,8vw,88px);font-weight:900;letter-spacing:-5px;text-shadow:3px 4px 0 #101b42;margin:20px 0 6px}.brand i{font-style:normal;color:#ff7a3d}.avatars{display:flex;justify-content:center;gap:7px;margin:0 auto 22px}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:3px solid #132d67;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}.home-card{width:min(465px,calc(100% - 28px));margin:auto;background:rgba(8,53,139,.88);padding:16px;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.2)}.row{display:flex;gap:7px}.input,.select{height:44px;border:1px solid #bbb;background:#fff;padding:0 12px;font-size:17px;outline:none}.input{flex:1}.select{width:150px}.avatar-pick{height:140px;display:grid;place-items:center;position:relative;color:#fff;font-size:78px}.arrow{position:absolute;background:none;color:#fff;font-size:45px;font-weight:900;top:45px}.arrow.left{left:28px}.arrow.right{right:28px}.btn{width:100%;height:52px;margin-top:10px;border:0;font-weight:800;font-size:20px;color:#fff;border-radius:2px}.play{background:var(--green);text-shadow:0 2px 0 #2b8f1f}.private{background:#3294e9}.home-info{width:min(900px,calc(100% - 28px));margin:24px auto 0;color:#fff;text-align:center}.home-info h3{margin:5px 0;font-size:18px}.home-info p{margin:4px;color:#e5efff}.hidden{display:none!important}
/* Room */.room{min-height:100vh;background:#f4f7fb}.roombar{height:54px;background:#2d5ca8;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.roomlogo{font-size:30px;font-weight:900;letter-spacing:-2px;text-shadow:2px 2px #172652}.roombar .round{font-weight:800}.game{height:calc(100vh - 54px);display:grid;grid-template-columns:220px minmax(0,1fr) 290px;grid-template-rows:1fr}.players{background:#eef1f4;border-right:2px solid #234e96;overflow:auto}.player{height:60px;display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #d5d8dd}.pavatar{width:42px;height:42px;display:grid;place-items:center;font-size:28px}.pname{font-size:14px;font-weight:700}.pscore{font-size:12px;color:#555}.canvas-area{min-width:0;position:relative;background:#fff;padding:6px;display:flex;flex-direction:column}.topword{text-align:center;height:34px;font-weight:800;font-size:13px}.canvas-wrap{flex:1;min-height:0;position:relative}.canvas{width:100%;height:100%;display:block;border:1px solid #ddd;background:#fff;touch-action:none}.likes{position:absolute;right:8px;top:8px;display:flex;gap:4px}.like{border:1px solid #aaa;background:#fff;border-radius:4px;font-size:20px;padding:2px 7px}.tools{height:44px;display:flex;align-items:center;gap:5px;justify-content:center}.tool{height:32px;min-width:32px;border:1px solid #aaa;background:#fff;border-radius:4px}.chat{background:#fff;border-left:2px solid #234e96;display:flex;flex-direction:column;min-width:0}.chathead{height:35px;padding:8px 10px;font-weight:800;border-bottom:1px solid #ddd}.chatlog{flex:1;overflow:auto;padding:7px}.msg{font-size:13px;padding:5px 7px;margin-bottom:3px}.join{color:#178b36;font-weight:700}.system{color:#2471c7;font-weight:700}.guess{color:#222}.chatform{display:flex;border-top:1px solid #ddd;padding:6px;gap:5px}.chatinput{flex:1;height:38px;border:1px solid #aaa;padding:0 8px}.send{height:38px;padding:0 12px;border:0;background:#2d5ca8;color:#fff;font-weight:700}.room-settings{position:absolute;right:8px;top:62px;background:#fff;border:1px solid #bbb;padding:12px;z-index:5;width:260px;box-shadow:0 5px 20px rgba(0,0,0,.2)}.room-settings label{display:block;font-size:12px;font-weight:700;margin:7px 0 3px}.room-settings select{width:100%;height:34px}.leave{background:#ef476f;color:#fff;border:0;padding:7px 12px;font-weight:700}
@media(max-width:700px){.brand{font-size:52px;margin:8px 0}.avatars{margin-bottom:12px}.avatar{width:34px;height:34px;font-size:19px}.home-card{padding:10px}.avatar-pick{height:105px;font-size:60px}.arrow{top:27px;font-size:34px}.arrow.left{left:14px}.arrow.right{right:14px}.input,.select{height:40px;font-size:14px}.select{width:110px}.btn{height:47px;font-size:18px}.home-info{display:none}.roombar{height:38px}.roomlogo{font-size:22px}.game{height:calc(100vh - 38px);grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) 145px;grid-template-areas:'canvas canvas' 'players chat';gap:2px;padding:2px}.players{grid-area:players;border:1px solid #31548f;min-width:0}.canvas-area{grid-area:canvas;padding:3px}.chat{grid-area:chat;border:1px solid #31548f;min-width:0}.topword{height:25px;font-size:10px}.tools{height:34px}.tool{height:27px;min-width:27px;font-size:11px}.player{height:40px;padding:3px}.pavatar{width:26px;height:26px;font-size:18px}.pname{font-size:10px}.pscore{font-size:8px}.chathead{height:24px;padding:5px 7px;font-size:10px}.msg{font-size:9px;padding:3px}.chatform{padding:3px;gap:3px}.chatinput{height:30px;font-size:10px}.send{height:30px;font-size:10px;padding:0 7px}.likes{top:4px;right:4px}.like{font-size:14px;padding:1px 4px}.room-settings{top:43px;right:3px;width:210px}.room-settings label{font-size:10px}}
</style>
</head>
<body>
<div id="home" class="bg">
  <div class="brand">Drawzy<span>!</span></div>
  <div class="avatars" id="avatarStrip"></div>
  <section class="home-card">
    <div class="row"><input id="name" class="input" maxlength="18" placeholder="Your name"><select id="language" class="select"><option>English</option><option>Hindi</option></select></div>
    <div class="avatar-pick"><button class="arrow left" onclick="avatar(-1)">‹</button><div id="avatarBig">😀</div><button class="arrow right" onclick="avatar(1)">›</button></div>
    <button class="btn play" onclick="quickPlay()">Play!</button>
    <button class="btn private" onclick="openCreate()">Create Private Room</button>
    <div id="joinBox" class="hidden" style="margin-top:10px;background:#0a428e;padding:10px"><div class="row"><input id="roomCode" class="input" maxlength="6" placeholder="Room code"><button class="btn private" style="width:auto;margin:0" onclick="joinRoom()">Join</button></div></div>
  </section>
  <div class="home-info"><h3>Draw. Guess. Repeat.</h3><p>A simple multiplayer drawing game for your community.</p></div>
</div>

<div id="createModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20"><div style="background:#fff;width:min(430px,calc(100% - 24px));padding:18px;border-radius:6px"><h2 style="margin:0 0 12px">Create Private Room</h2><label>Players</label><select id="maxPlayers" class="select" style="width:100%;margin-top:4px"><option>8</option><option>10</option><option>12</option></select><label>Rounds</label><select id="rounds" class="select" style="width:100%;margin-top:4px"><option>3</option><option>5</option><option>7</option></select><label>Draw time</label><select id="drawTime" class="select" style="width:100%;margin-top:4px"><option>60</option><option>80</option><option>120</option></select><button class="btn play" onclick="createRoom()">Create Room</button><button class="btn" style="background:#ddd;color:#222" onclick="closeCreate()">Cancel</button></div></div>

<div id="room" class="room hidden">
  <header class="roombar"><div class="roomlogo">Drawzy!</div><div class="round">Room <span id="roomCodeLabel">------</span> · Round <span id="roundLabel">1</span>/3</div><button class="leave" onclick="leaveRoom()">Leave</button></header>
  <main class="game">
    <aside class="players"><div id="playersList"></div></aside>
    <section class="canvas-area"><div class="topword" id="wordLabel">GUESS THIS · _ _ _ _</div><div class="canvas-wrap"><canvas id="canvas" class="canvas"></canvas><div class="likes"><button class="like" onclick="react(1)">👍 <span id="likesUp">0</span></button><button class="like" onclick="react(-1)">👎 <span id="likesDown">0</span></button></div></div><div class="tools"><button class="tool" onclick="setTool('pen')">✏️</button><button class="tool" onclick="setTool('eraser')">⌫</button><button class="tool" onclick="clearCanvas()">🗑️</button><input id="size" type="range" min="1" max="24" value="4" title="Brush size"></div></section>
    <aside class="chat"><div class="chathead">Chat</div><div id="chatlog" class="chatlog"></div><form class="chatform" onsubmit="sendChat(event)"><input id="chatinput" class="chatinput" maxlength="120" autocomplete="off" placeholder="Type your message..."><button class="send">Send</button></form></aside>
  </main>
</div>
<script>
const avatars=['😀','😎','🤓','👽','🤠','🥳','😈','🤖'];let avatarIndex=0;let roomId='';let players=[];let tool='pen';let drawing=false;let last={x:0,y:0};let likes={up:0,down:0};
const $=id=>document.getElementById(id);
function avatar(d){avatarIndex=(avatarIndex+d+avatars.length)%avatars.length;$('avatarBig').textContent=avatars[avatarIndex]}
function renderAvatars(){$('avatarStrip').innerHTML=avatars.map((a,i)=>`<div class="avatar" style="opacity:${i===avatarIndex?1:.75}">${a}</div>`).join('')}
function openCreate(){$('createModal').classList.remove('hidden');$('createModal').style.display='grid'}function closeCreate(){$('createModal').classList.add('hidden')}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function createRoom(){roomId=makeCode();closeCreate();startRoom(true)}
function quickPlay(){const code=prompt('Enter a room code to join:');if(code&&code.trim()){$('roomCode').value=code.trim();joinRoom()}else{$('joinBox').classList.remove('hidden')}}
function joinRoom(){roomId=$('roomCode').value.trim().toUpperCase();if(roomId.length<4)return alert('Enter a valid room code.');startRoom(false)}
function startRoom(host){const name=$('name').value.trim()||'Player';players=[{name,score:0,av:avatars[avatarIndex],host}];$('roomCodeLabel').textContent=roomId;$('roundLabel').textContent='1';$('home').classList.add('hidden');$('room').classList.remove('hidden');renderPlayers();addMsg(`${name} joined the room!`,'join');resizeCanvas();}
function renderPlayers(){$('playersList').innerHTML=`<div style="padding:7px;font-size:11px;font-weight:800">PLAYERS ${players.length}/8</div>`+players.map((p,i)=>`<div class="player"><div class="pavatar">${p.av}</div><div><div class="pname">#${i+1} ${escapeHtml(p.name)}${p.host?' 👑':''}</div><div class="pscore">${p.score} points</div></div></div>`).join('')}
function addMsg(text,kind='guess'){const d=document.createElement('div');d.className='msg '+kind;d.textContent=text;$('chatlog').appendChild(d);$('chatlog').scrollTop=$('chatlog').scrollHeight}
function sendChat(e){e.preventDefault();const v=$('chatinput').value.trim();if(!v)return;const name=$('name').value.trim()||'Player';addMsg(name+': '+v);$('chatinput').value=''}
function react(v){v>0?likes.up++:likes.down++;$('likesUp').textContent=likes.up;$('likesDown').textContent=likes.down}
function setTool(t){tool=t}
function clearCanvas(){const c=$('canvas'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
function pos(e){const c=$('canvas'),r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function startDraw(e){drawing=true;last=pos(e)}function moveDraw(e){if(!drawing)return;const c=$('canvas'),x=c.getContext('2d'),p=pos(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.lineWidth=+$('size').value;x.lineCap='round';x.strokeStyle=tool==='eraser'?'#fff':'#111';x.stroke();last=p}function stopDraw(){drawing=false}
function resizeCanvas(){const c=$('canvas'),r=c.getBoundingClientRect();if(!r.width||!r.height)return;const old=document.createElement('canvas');old.width=c.width;old.height=c.height;if(c.width&&c.height)old.getContext('2d').drawImage(c,0,0);c.width=Math.floor(r.width*devicePixelRatio);c.height=Math.floor(r.height*devicePixelRatio);const x=c.getContext('2d');x.scale(devicePixelRatio,devicePixelRatio);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);if(old.width) x.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}
$('canvas').addEventListener('pointerdown',e=>{e.preventDefault();$('canvas').setPointerCapture(e.pointerId);startDraw(e)});$('canvas').addEventListener('pointermove',e=>{e.preventDefault();moveDraw(e)});$('canvas').addEventListener('pointerup',stopDraw);$('canvas').addEventListener('pointercancel',stopDraw);window.addEventListener('resize',()=>{if(!$('room').classList.contains('hidden'))resizeCanvas()});
function leaveRoom(){$('room').classList.add('hidden');$('home').classList.remove('hidden');players=[];$('chatlog').innerHTML=''}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}renderAvatars();
</script>
</body>
</html>
