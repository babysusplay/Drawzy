<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drawzy</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#182033}body{background:#285ca8;overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}
.bg{min-height:100vh;background-color:#285ca8;background-image:radial-gradient(circle at 14px 18px,rgba(255,255,255,.08) 0 2px,transparent 3px),radial-gradient(circle at 55px 48px,rgba(0,0,0,.08) 0 2px,transparent 3px);background-size:80px 70px}
/* HOME */
.home{height:100dvh;overflow:auto;padding:18px 14px 35px;display:flex;align-items:center;flex-direction:column}.logo{font-size:clamp(54px,9vw,100px);font-weight:900;letter-spacing:-6px;line-height:1;color:#fff;text-shadow:3px 4px #12295c;margin:8px 0 12px}.logo b:nth-child(1){color:#ff4545}.logo b:nth-child(2){color:#ff9c24}.logo b:nth-child(3){color:#ffe326}.logo b:nth-child(4){color:#5fe13d}.logo b:nth-child(5){color:#25d9eb}.logo b:nth-child(6){color:#b35bea}.faces{display:flex;gap:7px;margin-bottom:18px}.face{font-size:27px;filter:drop-shadow(2px 2px #17386d)}.homeCard{width:min(470px,100%);background:rgba(8,54,137,.94);padding:15px;border-radius:3px;box-shadow:0 10px 30px #092c6b55}.row{display:flex;gap:7px}.field{height:45px;border:1px solid #b9c1cf;background:#fff;padding:0 11px;border-radius:2px;min-width:0}.grow{flex:1}.lang{width:145px}.avatarPick{height:142px;display:flex;align-items:center;justify-content:center;position:relative}.bigFace{font-size:90px;filter:drop-shadow(3px 4px #071b40)}.arrow{position:absolute;background:transparent;color:#fff;font-size:48px;font-weight:900}.arrow.l{left:25px}.arrow.r{right:25px}.homeBtn{width:100%;height:56px;border:0;color:#fff;font-weight:900;font-size:25px;border-radius:3px;margin-top:9px}.green{background:#48e52b;text-shadow:0 2px #288d1a}.blue{background:#3195e9}.intro{max-width:800px;color:#fff;text-align:center;margin:20px 10px}.intro p{margin:5px 0;opacity:.9}
/* PRIVATE SETTINGS */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,20,50,.62);display:grid;place-items:center;padding:12px}.settingsCard{width:min(760px,100%);background:#fff;box-shadow:0 12px 35px #0005}.settingsHead{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:3px solid #285ca8;font-weight:900}.settingsGrid{padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:9px 20px}.set{display:grid;grid-template-columns:125px 1fr;align-items:center;gap:7px}.set label{font-weight:700}.set select{height:38px;border:1px solid #aab1bc;background:#fff;padding:0 7px}.customTitle{padding:0 13px;font-weight:800;display:flex;justify-content:space-between}.custom{margin:5px 13px 0;width:calc(100% - 26px);height:95px;border:1px solid #aab1bc;padding:8px;resize:none}.settingsActions{display:flex;gap:7px;padding:12px}.settingsActions button{height:53px;border:0;color:#fff;font-weight:900;font-size:20px}.start{flex:1;background:#48e52b}.invite{background:#3195e9;padding:0 24px}.cancel{background:#777;padding:0 20px}
/* ROOM */
.room{height:100dvh;background:#285ca8;display:grid;grid-template-rows:48px 1fr}.bar{background:#fff;display:grid;grid-template-columns:180px 1fr 60px;align-items:center;border-bottom:3px solid #214f9a}.smallLogo{font-weight:900;font-size:31px;letter-spacing:-3px;padding-left:8px}.status{text-align:center;font-weight:800}.gear{background:none;font-size:28px}.layout{min-height:0;display:grid;grid-template-columns:235px minmax(0,1fr) 315px;gap:5px;padding:5px}.panel{background:#fff;min-height:0}.players{overflow:auto}.panelHead{height:36px;border-bottom:1px solid #ccd0d8;padding:8px 9px;font-weight:900;display:flex;justify-content:space-between}.p{height:58px;display:grid;grid-template-columns:43px 1fr 55px;align-items:center;padding:4px 7px;border-bottom:1px solid #d8dbe0}.p:nth-child(even){background:#f1f1f1}.p.drawing{box-shadow:inset 4px 0 #2e91e8}.pface{font-size:29px;text-align:center}.pn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ps{font-size:11px;color:#555}.score{text-align:center;font-size:12px}.canvasPanel{position:relative;background:#fff;display:flex;flex-direction:column;min-width:0}.wordbar{height:40px;text-align:center;font-weight:900;padding:10px 4px}.wordbar small{font-size:10px;display:block}.canvasWrap{position:relative;flex:1;min-height:0}.canvas{width:100%;height:100%;display:block;background:#fff;touch-action:none}.reacts{position:absolute;right:8px;top:7px;display:flex;gap:4px}.reacts button{background:#fff;border:1px solid #aaa;border-radius:5px;padding:4px 8px;font-size:20px}.tools{height:58px;border-top:1px solid #bbb;display:flex;align-items:center;gap:5px;padding:5px;overflow-x:auto;background:#fff}.tool{min-width:44px;height:44px;border:1px solid #b8bec8;background:#fff;border-radius:4px;font-size:21px}.tool.active{background:#9554dc;color:#fff}.colors{display:flex;gap:3px}.dot{width:30px;height:30px;border:2px solid #fff;outline:1px solid #888;border-radius:3px;padding:0}.shapeMenu{position:absolute;bottom:61px;left:5px;background:#fff;border:1px solid #aaa;padding:6px;display:flex;gap:5px;box-shadow:0 5px 18px #0003}.chat{display:flex;flex-direction:column}.chatHead{height:36px;border-bottom:1px solid #ccd0d8;padding:9px;font-weight:900}.chatLog{flex:1;overflow:auto;padding:4px}.msg{font-size:14px;padding:5px 6px;line-height:1.15}.join,.correct{color:#32a21f;font-weight:700}.drawingMsg{color:#2b86db;font-weight:700}.leave{color:#e34a29;font-weight:700}.skip{color:#c57a00;font-weight:700}.normal{color:#111}.chatForm{display:flex;border-top:1px solid #bbb}.chatForm input{flex:1;min-width:0;height:42px;border:0;padding:0 9px}.chatForm button{width:52px;border:0;background:#3195e9;color:#fff;font-weight:800}
/* CHOOSER */
.chooser{position:absolute;inset:0;background:rgba(30,36,54,.72);z-index:8;display:flex;align-items:center;justify-content:center}.chooseBox{background:#fff;padding:18px;width:min(440px,90%);text-align:center;border-radius:5px}.chooseBox h2{margin:0 0 13px}.wordChoice{display:block;width:100%;height:48px;margin:7px 0;background:#3195e9;color:#fff;border:0;border-radius:3px;font-weight:800;font-size:18px}.wordChoice:hover{background:#237bc6}
/* RESULT */
.result{position:fixed;inset:0;background:#34394b;color:#fff;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center}.resultBox{width:min(500px,92%)}.resultArt{font-size:125px}.resultBox h2{font-size:28px;margin:4px}.resultBox h2 b{color:#ffd0ad}.results{width:min(360px,100%);margin:16px auto}.resultRow{display:flex;justify-content:space-between;font-size:19px}.plus{color:#32ee25}.zero{color:#ff3434}.next{background:#3195e9;color:#fff;border:0;padding:12px 25px;font-weight:900;font-size:18px}
.toast{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:4px}
@media(max-width:760px){body{overflow:hidden}.home{padding:10px 10px 20px}.logo{font-size:52px;letter-spacing:-4px;margin:4px 0 8px}.faces{margin-bottom:9px;gap:4px}.face{font-size:21px}.homeCard{padding:9px}.field{height:39px;font-size:14px}.lang{width:105px}.avatarPick{height:105px}.bigFace{font-size:68px}.arrow{font-size:37px}.arrow.l{left:8px}.arrow.r{right:8px}.homeBtn{height:48px;font-size:19px;margin-top:7px}.intro{display:none}.settingsGrid{gap:6px 8px;padding:8px}.set{grid-template-columns:67px 1fr;gap:4px}.set label{font-size:10px}.set select{height:33px;font-size:11px}.settingsHead{height:44px;font-size:16px}.customTitle{font-size:11px;padding:0 8px}.custom{margin:4px 8px;width:calc(100% - 16px);height:72px;font-size:11px}.settingsActions{padding:8px;gap:4px}.settingsActions button{height:44px;font-size:15px}.invite,.cancel{padding:0 12px}.room{grid-template-rows:35px 1fr}.bar{grid-template-columns:78px 1fr 38px;border-bottom-width:2px}.smallLogo{font-size:22px;padding-left:4px}.status{font-size:9px}.gear{font-size:22px}.layout{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) 35%;grid-template-areas:'canvas canvas' 'players chat';gap:2px;padding:2px}.players{grid-area:players}.canvasPanel{grid-area:canvas}.chat{grid-area:chat}.panelHead{height:27px;font-size:11px;padding:6px}.p{height:42px;grid-template-columns:26px 1fr 38px;padding:2px 4px}.pface{font-size:19px}.pn{font-size:10px}.ps{font-size:8px}.score{font-size:9px}.wordbar{height:25px;font-size:10px;padding:6px 2px}.wordbar small{font-size:7px}.tools{height:43px;padding:3px;gap:3px}.tool{height:35px;min-width:35px;font-size:17px}.dot{width:24px;height:24px}.reacts{top:3px;right:3px}.reacts button{font-size:16px;padding:2px 5px}.chatHead{height:27px;font-size:11px;padding:7px}.msg{font-size:9px;padding:3px}.chatForm input,.chatForm button{height:34px;font-size:10px}.chatForm button{width:40px}.shapeMenu{bottom:46px}.chooser{inset:0}.chooseBox{padding:13px}.chooseBox h2{font-size:19px}.wordChoice{height:42px;font-size:15px}.resultArt{font-size:90px}.resultBox h2{font-size:22px}}
</style>
</head>
<body>
<div id="home" class="bg home">
  <div class="logo"><b>D</b><b>r</b><b>a</b><b>w</b><b>z</b><b>y</b><b>!</b></div>
  <div class="faces"><span class="face">🔴</span><span class="face">🟠</span><span class="face">🟡</span><span class="face">🟢</span><span class="face">🔵</span><span class="face">🟣</span><span class="face">🩷</span><span class="face">⚪</span></div>
  <section class="homeCard"><div class="row"><input id="name" class="field grow" maxlength="18" placeholder="Your name"><select id="lang" class="field lang"><option>English</option><option>Hindi</option></select></div><div class="avatarPick"><button class="arrow l" onclick="changeAvatar(-1)">‹</button><div id="bigFace" class="bigFace">😀</div><button class="arrow r" onclick="changeAvatar(1)">›</button></div><button class="homeBtn green" onclick="playPublic()">Play!</button><button class="homeBtn blue" onclick="openPrivate()">Create Private Room</button></section>
  <div class="intro"><b>Draw. Guess. Have fun.</b><p>A simple drawing and guessing game for your community.</p></div>
</div>
<div id="privateModal" class="modal hide"><section class="settingsCard"><header class="settingsHead"><span>Create Private Room</span><button onclick="closePrivate()">✕</button></header><div class="settingsGrid"><div class="set"><label>Players</label><select id="sPlayers"><option>8</option><option>10</option><option>12</option></select></div><div class="set"><label>Language</label><select id="sLang"><option>English</option><option>Hindi</option></select></div><div class="set"><label>Draw time</label><select id="sTime"><option>60</option><option selected>80</option><option>100</option><option>120</option></select></div><div class="set"><label>Rounds</label><select id="sRounds"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></div><div class="set"><label>Game mode</label><select id="sMode"><option>Classic</option><option>Normal</option></select></div><div class="set"><label>Word count</label><select id="sWords"><option>2</option><option selected>3</option><option>4</option></select></div><div class="set"><label>Hints</label><select id="sHints"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></div></div><div class="customTitle"><span>Custom words</span><label><input id="customOnly" type="checkbox"> Use custom words only</label></div><textarea id="customWords" class="custom" placeholder="Minimum of 10 words. Separate by commas"></textarea><div class="settingsActions"><button class="start" onclick="createPrivate()">Start!</button><button class="invite" onclick="createPrivate(true)">🔗 Invite</button><button class="cancel" onclick="closePrivate()">Cancel</button></div></section></div>
<div id="room" class="room hide"><header class="bar"><div class="smallLogo">Drawzy!</div><div id="status" class="status">WAITING</div><button class="gear" onclick="toast('Host settings')">⚙️</button></header><main class="layout"><aside class="panel players"><div class="panelHead"><span>👥 Players</span><span id="count">1/8</span></div><div id="players"></div></aside><section class="canvasPanel"><div id="wordbar" class="wordbar">GUESS THIS</div><div class="canvasWrap"><canvas id="canvas" class="canvas"></canvas><div class="reacts"><button onclick="react('up')">👍 <span id="up">0</span></button><button onclick="react('down')">👎 <span id="down">0</span></button></div><div id="chooser" class="chooser hide"><div class="chooseBox"><h2>Choose a word</h2><div id="choices"></div></div></div></div><div class="tools"><button class="tool active" onclick="setTool('pen',this)">✏️</button><button class="tool" onclick="toggleShapes()">◼</button><div id="shapeMenu" class="shapeMenu hide"><button class="tool" onclick="setTool('line')">╱</button><button class="tool" onclick="setTool('rect')">□</button><button class="tool" onclick="setTool('circle')">○</button></div><button class="tool" onclick="setTool('eraser',this)">⌫</button><div class="colors"><button class="dot" style="background:#111" onclick="setColor('#111')"></button><button class="dot" style="background:#e33" onclick="setColor('#e33')"></button><button class="dot" style="background:#f90" onclick="setColor('#f90')"></button><button class="dot" style="background:#fd3" onclick="setColor('#fd3')"></button><button class="dot" style="background:#29c943" onclick="setColor('#29c943')"></button><button class="dot" style="background:#24a9e8" onclick="setColor('#24a9e8')"></button><button class="dot" style="background:#7b49d8" onclick="setColor('#7b49d8')"></button></div><input id="brushSize" type="range" min="2" max="24" value="5" title="Brush size"><button class="tool" onclick="undo()">↶</button><button class="tool" onclick="redo()">↷</button><button class="tool" onclick="clearCanvas()">🗑️</button></div></section><aside class="panel chat"><div class="chatHead">💬 Chat</div><div id="chatLog" class="chatLog"></div><form class="chatForm" onsubmit="sendChat(event)"><input id="chatInput" maxlength="120" autocomplete="off" placeholder="Type your guess here..."><button>➤</button></form></aside></main></div>
<div id="result" class="result hide"><div class="resultBox"><div class="resultArt">🧸</div><h2>The word was <b id="resultWord">teddy bear</b></h2><div>Time is up!</div><div id="results" class="results"></div><button class="next" onclick="nextRound()">Next round</button></div></div>
<script>
const A=['😀','😎','🤓','👽','🤠','🥳','😈','🤖'],N=['Baby','Rahul','ChatGPT','John','lily','n0unz','Yk','siuuu'],W=['pizza','rocket','castle','car','teddy bear','apple','banana','house','guitar','camera','football','ice cream','dog','flower','airplane','computer'];let av=0,room='',players=[],settings={rounds:3,time:80,words:3},round=1,turn=0,word='',tool='pen',color='#111',drawing=false,last=null,undoStack=[],redoStack=[],timer=null,up=0,down=0,audio;
const $=id=>document.getElementById(id);
function beep(kind){try{audio??=new(window.AudioContext||window.webkitAudioContext)();let f={join:660,leave:240,draw:520,choose:760,correct:920,skip:330,score:1040,time:160,like:620,click:420}[kind]||420,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type=kind==='correct'||kind==='score'?'triangle':'sine';g.gain.value=.035;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}}
function changeAvatar(d){av=(av+d+A.length)%A.length;$('bigFace').textContent=A[av]}
function openPrivate(){$('privateModal').classList.remove('hide')};function closePrivate(){$('privateModal').classList.add('hide')}
function code(){return Math.random().toString(36).slice(2,7).toUpperCase()}
function me(){return $('name').value.trim()||'Baby'}
function playPublic(){room=code();settings={rounds:3,time:80,words:3};startGame(false);beep('join')}
function createPrivate(invite=false){room=code();settings={rounds:+$('sRounds').value,time:+$('sTime').value,words:+$('sWords').value};closePrivate();startGame(true);if(invite)share();}
function share(){let u=location.href.split('#')[0]+'#room='+room;navigator.clipboard?.writeText(u);toast('Invite link copied!');beep('click')}
function startGame(host){players=[{name:me(),av:A[av],score:0,host,me:true}];for(let i=1;i<4;i++)players.push({name:N[i],av:A[i],score:0});$('home').classList.add('hide');$('room').classList.remove('hide');$('status').textContent=host?'WAITING · '+room:'ROUND 1 · '+room;$('count').textContent=players.length+'/8';renderPlayers();addMsg(players[0].name+' joined the room!','join');startTurn()}
function renderPlayers(){let s=players.slice().sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="p ${i===turn?'drawing':''}"><div class="pface">${p.av}</div><div><div class="pn ${p.me?'you':''}">#${i+1} ${esc(p.name)}${p.me?' (You)':''}</div><div class="ps">${p.score} points</div></div><div class="score">${p.score}</div></div>`).join('');$('players').innerHTML=s;$('count').textContent=players.length+'/8'}
function startTurn(){clearInterval(timer);word=W[Math.floor(Math.random()*W.length)];$('status').textContent=`Round ${round} · ${settings.time}s`;$('wordbar').innerHTML=`<small>${turn===0?'YOU ARE DRAWING':'GUESS THIS'}</small>${turn===0?'Choose a word':' '+mask(word)}`;if(turn===0){showChooser();addMsg(me()+' is choosing a word...','drawing');beep('choose')}else{addMsg(players[turn].name+' is drawing now!','drawing');drawDemo();}renderPlayers();let t=settings.time;timer=setInterval(()=>{t--;if(t<=0){clearInterval(timer);roundResult()}},1000)}
function showChooser(){let list=[];while(list.length<settings.words){let x=W[Math.floor(Math.random()*W.length)];if(!list.includes(x))list.push(x)}$('choices').innerHTML=list.map(x=>`<button class="wordChoice" onclick="chooseWord('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('');$('chooser').classList.remove('hide')}
function chooseWord(x){word=x;$('chooser').classList.add('hide');$('wordbar').innerHTML=`<small>GUESS THIS</small>${mask(word)}`;addMsg(me()+' is drawing now!','drawing');beep('draw');drawDemo()}
function mask(x){return x.split('').map(c=>c===' '?'  ':'_').join(' ')}
function drawDemo(){setTimeout(()=>{if(!ctx)return;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();let w=canvas.clientWidth,h=canvas.clientHeight;ctx.moveTo(w*.38,h*.4);ctx.quadraticCurveTo(w*.44,h*.18,w*.56,h*.34);ctx.quadraticCurveTo(w*.68,h*.46,w*.57,h*.58);ctx.quadraticCurveTo(w*.45,h*.7,w*.38,h*.56);ctx.stroke()},80)}
let canvas=$('canvas'),ctx=canvas.getContext('2d');function resize(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function snap(){undoStack.push(canvas.toDataURL());if(undoStack.length>40)undoStack.shift();redoStack=[]}
function restore(src){let im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight)};im.src=src}
function downDraw(e){e.preventDefault();drawing=true;last=point(e);snap();canvas.setPointerCapture(e.pointerId)}function moveDraw(e){if(!drawing)return;let p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=+$('brushSize').value;ctx.strokeStyle=tool==='eraser'?'#fff':color;ctx.stroke();last=p}function upDraw(){drawing=false}
canvas.addEventListener('pointerdown',downDraw);canvas.addEventListener('pointermove',moveDraw);canvas.addEventListener('pointerup',upDraw);canvas.addEventListener('pointercancel',upDraw);
function setTool(t,b){tool=t;$('shapeMenu').classList.add('hide');document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
function setColor(c){color=c;setTool('pen');beep('click')};function toggleShapes(){$('shapeMenu').classList.toggle('hide')}
function clearCanvas(){snap();ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);beep('click')};function undo(){if(!undoStack.length)return;redoStack.push(canvas.toDataURL());let s=undoStack.pop();s?restore(s):clearCanvas();beep('click')};function redo(){if(!redoStack.length)return;undoStack.push(canvas.toDataURL());restore(redoStack.pop());beep('click')}
function addMsg(text,kind='normal'){let d=document.createElement('div');d.className='msg '+kind;d.textContent=text;$('chatLog').appendChild(d);$('chatLog').scrollTop=$('chatLog').scrollHeight}
function sendChat(e){e.preventDefault();let v=$('chatInput').value.trim();if(!v)return;if(v.toLowerCase()===word.toLowerCase()){let p=players.find(x=>x.me)||players[0];p.score+=100;addMsg(p.name+' guessed the word!','correct');beep('correct');renderPlayers()}else addMsg(me()+': '+v);$('chatInput').value=''}
function react(type){if(type==='up')up++;else down++;$('up').textContent=up;$('down').textContent=down;addMsg(me()+(type==='up'?' liked the drawing!':' disliked the drawing!'),'normal');beep('like')}
function roundResult(){clearInterval(timer);$('resultWord').textContent=word;$('results').innerHTML=players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="resultRow"><span>${esc(p.name)}</span><span class="${p.score?'plus':'zero'}">${p.score?'+':''}${p.score}</span></div>`).join('');$('result').classList.remove('hide');beep('score')}
function nextRound(){$('result').classList.add('hide');round++;if(round>settings.rounds){round=1;players.forEach(p=>p.score=0)}turn=(turn+1)%players.length;clearCanvas();startTurn()}
function leaveRoom(){clearInterval(timer);$('room').classList.add('hide');$('home').classList.remove('hide');$('chatLog').innerHTML='';toast('Left room');beep('leave')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))};function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
window.addEventListener('hashchange',()=>{let m=location.hash.match(/room=([A-Z0-9]+)/);if(m){room=m[1];startGame(false)}});
</script>
</body>
</html>
