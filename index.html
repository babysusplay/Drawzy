function renderGame(){document.body.classList.add('game-active','no-site-header');const drawer=state.game.drawer===state.name,hasChoices=drawer&&!state.game.word,drawingLabel=state.game.drawer?`${esc(state.game.drawer)} is drawing`:'Waiting',choices=hasChoices?`<div class="word-choice-overlay"><div class="word-choice-card"><h3>Choose a word</h3><p>Pick one to start drawing.</p><div class="word-choice-grid">${state.game.choices.map((w,i)=>`<button class="btn primary word-choice" data-i="${i}">${esc(w)}</button>`).join('')}</div><div class="choice-countdown">Choose quickly</div></div></div>`:'';app.innerHTML=`<div class="card game-topbar"><div class="game-top-left"><button class="btn ghost" id="leaveGame">← Leave</button>${drawer?'<button class="btn danger skip-btn" id="skipTurn">Skip −25</button>':''}<div class="round-label"><strong>Round ${state.game.round} / ${state.settings.rounds}</strong><span>${drawingLabel}</span></div></div><div class="game-word-area"><div class="word" id="gameWord">${drawer?(state.game.word?esc(state.game.word):'Pick a word'):esc(state.game.display)}</div><div class="hint" id="hintStatus">${state.settings.hints>0?'💡 Hints on':'💡 Hints off'} • ${state.game.correct.length}/${Math.max(0,state.players.length-1)} correct</div></div><div class="game-top-right"><div class="timer" id="gameTimer">⏱ ${state.game.time}s</div></div></div><div class="room-layout"><aside class="card side"><h3>LIVE RANKING</h3><div class="players" id="ranking">${sortedPlayers().map(playerHTML).join('')}</div></aside><section class="card stage-card"><div class="canvas-wrap"><canvas id="drawCanvas"></canvas><div class="canvas-drawer-name">${drawingLabel}</div><div class="canvas-reactions"><button class="react-btn" id="likeBtn">👍 <span id="likeCount">${state.game.likes||0}</span></button><button class="react-btn" id="dislikeBtn">👎 <span id="dislikeCount">${state.game.dislikes||0}</span></button></div>${choices}</div><div class="tools"><div class="tool-menu" id="colorMenu"><button class="tool" id="colorBtn">●</button><div class="tool-menu-panel">${['#111827','#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#ffffff'].map(c=>`<button class="color" data-color="${c}" style="background:${c}"></button>`).join('')}</div></div><button class="tool active" id="pencil">✎</button><button class="tool" id="brush">●</button><div class="tool-menu" id="shapeMenu"><button class="tool" id="shapeBtn">◇</button><div class="tool-menu-panel" style="grid-template-columns:repeat(2,40px)"><button class="tool shapePick" data-shape="none">✎</button><button class="tool shapePick" data-shape="circle">○</button><button class="tool shapePick" data-shape="square">□</button><button class="tool shapePick" data-shape="triangle">△</button></div></div><button class="tool" id="eraser">⌫</button><button class="tool" id="undo">↶</button><button class="tool" id="redo">↷</button><button class="tool" id="clear">🧹</button><input class="tool-range" id="size" type="range" min="2" max="30" value="7"></div></section><aside class="card chat"><h3>💬 ROOM CHAT</h3><div class="chat-log" id="chatLog"></div><form class="chat-form" id="chatForm"><input class="input" id="guess" autocomplete="off" placeholder="Type your guess..."><button class="btn primary">Send</button></form></aside></div>`;setupCanvas();addMessage('SYSTEM',`${state.game.drawer} is drawing now!`,'drawing');$('#leaveGame').onclick=()=>{clearInterval(timerId);state.screen='lobby';render()};if($('#skipTurn'))$('#skipTurn').onclick=skipCurrentTurn;$('#chatForm').onsubmit=e=>{e.preventDefault();sendGuess($('#guess').value);$('#guess').value=''};const cm=$('#colorMenu'),sm=$('#shapeMenu');$('#colorBtn').onclick=()=>{cm.classList.toggle('open');sm.classList.remove('open')};$('#shapeBtn').onclick=()=>{sm.classList.toggle('open');cm.classList.remove('open')};document.querySelectorAll('#colorMenu .color').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;state.eraser=false;cm.classList.remove('open')});$('#pencil').onclick=()=>setTool('pencil');$('#brush').onclick=()=>setTool('brush');$('#eraser').onclick=()=>{state.eraser=true;state.tool='brush';state.shape='none';$('#eraser').classList.add('active');$('#pencil').classList.remove('active');$('#brush').classList.remove('active')};document.querySelectorAll('#shapeMenu .shapePick').forEach(b=>b.onclick=()=>{state.eraser=false;state.shape=b.dataset.shape;sm.classList.remove('open')});$('#clear').onclick=clearCanvas;$('#undo').onclick=undoCanvas;$('#redo').onclick=redoCanvas;$('#size').oninput=e=>state.size=+e.target.value;document.querySelectorAll('.word-choice').forEach(b=>b.onclick=()=>chooseWord(state.game.choices[+b.dataset.i]||state.game.choices[0]));$('#likeBtn').onclick=()=>reactDrawing('like');$('#dislikeBtn').onclick=()=>reactDrawing('dislike');if(hasChoices)startChoiceCountdown();startTimer()}
function setTool(tool){state.eraser=false;state.tool=tool;state.shape='none';['pencil','brush','eraser'].forEach(id=>$('#'+id)?.classList.remove('active'));$('#'+tool)?.classList.add('active')}
function reactDrawing(type){if(type==='like'){SOUND.like();state.game.likes++;state.game.dislikes=Math.max(0,state.game.dislikes-1);$('#likeBtn').classList.add('active-like');$('#dislikeBtn').classList.remove('active-dislike')}else{SOUND.dislike();state.game.dislikes++;state.game.likes=Math.max(0,state.game.likes-1);$('#dislikeBtn').classList.add('active-dislike');$('#likeBtn').classList.remove('active-like')}$('#likeCount').textContent=state.game.likes;$('#dislikeCount').textContent=state.game.dislikes}
function startChoiceCountdown(){clearTimeout(choiceTimer);choiceTimer=setTimeout(()=>{if(state.screen==='game'&&!state.game.word)chooseWord(state.game.choices[0])},5000)}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(state.game.time>0)state.game.time--;const el=$('#gameTimer');if(el)el.textContent='⏱ '+state.game.time+'s';if(state.game.time<=0){clearInterval(timerId);SOUND.round();nextTurn()}},1000)}
function nextTurn(){clearInterval(timerId);state.game.turn++;if(state.game.turn>=state.players.length*state.settings.rounds){finishGame();return}if(state.game.turn%state.players.length===0)state.game.round++;pickDrawer()}
function sendGuess(raw){const guess=raw.trim();if(!guess)return;if(state.game.drawer===state.name){SOUND.wrong();toast('You are the drawer this turn');return}addMessage(state.name,guess);if(!state.game.word)return;if(guess.toLowerCase()===state.game.word.toLowerCase()){if(state.game.correct.includes(state.name))return;state.game.correct.push(state.name);const idx=state.game.correct.length,pts=Math.max(40,220-(idx-1)*25)+state.game.time,p=state.players.find(x=>x.name===state.name),d=state.players.find(x=>x.name===state.game.drawer);if(p)p.score+=pts;if(d)d.score+=35;state.players.forEach(x=>x.correct=state.game.correct.includes(x.name));addMessage('SYSTEM',`${state.name} guessed the word! +${pts} points`,'correct');SOUND.score();updateRanking();if(state.game.correct.length>=Math.max(1,state.players.length-1))setTimeout(nextTurn,700)}else if(state.game.word.toLowerCase().includes(guess.toLowerCase())&&guess.length>=2){addMessage('SYSTEM','Close guess!','system')}else SOUND.wrong()}
function updateRanking(){const r=$('#ranking');if(r)r.innerHTML=sortedPlayers().map(playerHTML).join('')}
function skipCurrentTurn(){if(state.game.drawer!==state.name)return;const p=state.players.find(x=>x.name===state.name);if(p)p.score=Math.max(0,p.score-25);addMessage('SYSTEM',`${state.name} skipped the drawing. −25 points`,'skip');clearInterval(timerId);SOUND.skip();nextTurn()}
function finishGame(){clearInterval(timerId);state.game.finished=true;state.screen='result';SOUND.end();render()}
function renderResult(){const sorted=sortedPlayers();app.innerHTML=`<div class="card result" style="padding:24px;max-width:760px;margin:auto"><div class="kicker">GAME COMPLETE</div><h1>🏆 Results</h1><p class="muted">Great game! Here is the final ranking.</p><div class="rank-list">${sorted.map((p,i)=>`<div class="player"><div class="p-av">${i===0?'👑':i+1}</div><div class="p-info"><div class="p-name">${p.avatar} ${esc(p.name)}</div><div class="p-score">${p.score} pts</div></div></div>`).join('')}</div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn green" id="again">🔁 Play Again</button><button class="btn ghost" id="home">⌂ Home</button></div></div>`;$('#again').onclick=()=>{state.game.round=1;state.game.turn=0;startCountdown()};$('#home').onclick=home}
function setupCanvas(){const c=$('#drawCanvas');if(!c)return;state.canvas=c;state.ctx=c.getContext('2d');let shapeSnapshot=null;const resize=()=>{const dpr=Math.max(1,devicePixelRatio||1),r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));state.ctx=c.getContext('2d');state.ctx.setTransform(dpr,0,0,dpr,0,0);state.ctx.lineCap='round';state.ctx.lineJoin='round';state.ctx.fillStyle='#fff';state.ctx.fillRect(0,0,r.width,r.height)};resize();state.history=[];state.future=[];state.history.push(state.ctx.getImageData(0,0,c.width,c.height));const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{if(state.game.drawer!==state.name||!state.game.word)return;state.drawing=true;const p=pos(e);state.lastX=p.x;state.lastY=p.y;state.startX=p.x;state.startY=p.y;c.setPointerCapture(e.pointerId);if(state.shape&&state.shape!=='none')shapeSnapshot=state.ctx.getImageData(0,0,c.width,c.height)};c.onpointermove=e=>{if(!state.drawing)return;const p=pos(e),ctx=state.ctx;if(state.shape&&state.shape!=='none'){if(shapeSnapshot)ctx.putImageData(shapeSnapshot,0,0);drawShape(ctx,state.shape,state.startX,state.startY,p.x,p.y)}else{ctx.beginPath();ctx.moveTo(state.lastX,state.lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle=state.eraser?'#fff':state.color;ctx.lineWidth=state.tool==='brush'?Math.max(8,state.size*1.7):state.size;ctx.stroke();state.lastX=p.x;state.lastY=p.y}};const end=e=>{if(!state.drawing)return;const p=pos(e);if(state.shape&&state.shape!=='none'){if(shapeSnapshot)state.ctx.putImageData(shapeSnapshot,0,0);drawShape(state.ctx,state.shape,state.startX,state.startY,p.x,p.y);shapeSnapshot=null}state.drawing=false;pushCanvasHistory()};c.onpointerup=end;c.onpointercancel=end}
function pushCanvasHistory(){if(!state.canvas||!state.ctx)return;try{state.history.push(state.ctx.getImageData(0,0,state.canvas.width,state.canvas.height));if(state.history.length>30)state.history.shift();state.future=[]}catch{}}function undoCanvas(){if(state.history.length<2)return;const cur=state.history.pop();state.future.push(cur);state.ctx.putImageData(state.history[state.history.length-1],0,0);SOUND.tone(392,.07,'triangle',.018)}function redoCanvas(){if(!state.future.length)return;const img=state.future.pop();state.history.push(img);state.ctx.putImageData(img,0,0);SOUND.tone(659,.07,'triangle',.018)}
function drawShape(ctx,shape,x1,y1,x2,y2){ctx.strokeStyle=state.color;ctx.lineWidth=state.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();const w=x2-x1,h=y2-y1;if(shape==='circle'){ctx.ellipse(x1+w/2,y1+h/2,Math.max(2,Math.abs(w)/2),Math.max(2,Math.abs(h)/2),0,0,Math.PI*2)}else if(shape==='square'){const side=Math.max(Math.abs(w),Math.abs(h));ctx.rect(x1,y1,Math.sign(w||1)*side,Math.sign(h||1)*side)}else if(shape==='triangle'){ctx.moveTo(x1+w/2,y1);ctx.lineTo(x2,y2);ctx.lineTo(x1,y2);ctx.closePath()}ctx.stroke()}
function clearCanvas(){if(!state.ctx||!state.canvas)return;const r=state.canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);state.ctx.save();state.ctx.setTransform(dpr,0,0,dpr,0,0);state.ctx.fillStyle='#fff';state.ctx.fillRect(0,0,r.width,r.height);state.ctx.restore();state.history=[];state.future=[];state.history.push(state.ctx.getImageData(0,0,state.canvas.width,state.canvas.height))}
function addMessage(name,text,kind=''){const log=$('#chatLog');if(!log)return;const d=document.createElement('div');d.className='msg '+kind;d.innerHTML=`<strong>${esc(name)}</strong>: ${esc(text)}`;log.appendChild(d);log.scrollTop=log.scrollHeight;if(kind==='correct')SOUND.correct();else if(kind==='drawing')SOUND.drawing()}
function setupLobbyCanvas(){const c=$('#lobbyCanvas');if(!c)return;state.canvas=c;state.ctx=c.getContext('2d');const r=c.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));state.ctx.setTransform(dpr,0,0,dpr,0,0);state.ctx.fillStyle='#fff';state.ctx.fillRect(0,0,r.width,r.height);const pos=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};c.onpointerdown=e=>{state.drawing=true;const p=pos(e);state.lastX=p.x;state.lastY=p.y;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!state.drawing)return;const p=pos(e);state.ctx.beginPath();state.ctx.moveTo(state.lastX,state.lastY);state.ctx.lineTo(p.x,p.y);state.ctx.strokeStyle=state.eraser?'#fff':state.color;state.ctx.lineWidth=state.tool==='brush'?Math.max(8,state.size*1.7):state.size;state.ctx.stroke();state.lastX=p.x;state.lastY=p.y};c.onpointerup=()=>state.drawing=false;const cm=$('#lobbyColorMenu'),sm=$('#lobbyShapeMenu');$('#lobbyColorBtn').onclick=()=>{cm.classList.toggle('open');sm.classList.remove('open')};$('#lobbyShapeBtn').onclick=()=>{sm.classList.toggle('open');cm.classList.remove('open')};document.querySelectorAll('#lobbyColorMenu .color').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;state.eraser=false;cm.classList.remove('open')});$('#lobbyPencil').onclick=()=>setTool('pencil');$('#lobbyBrush').onclick=()=>setTool('brush');$('#lobbyEraser').onclick=()=>{state.eraser=true;state.tool='brush'};document.querySelectorAll('#lobbyShapeMenu .shapePick').forEach(b=>b.onclick=()=>{state.shape=b.dataset.shape;sm.classList.remove('open')});$('#lobbyClear').onclick=clearCanvas;$('#lobbySize').oninput=e=>state.size=+e.target.value}
function profile(){openModal(`<button class="close-x" id="mx">×</button><h2>Your profile</h2><div class="field"><label>DISPLAY NAME</label><input class="input" id="pname" maxlength="20" value="${esc(state.name)}"></div><div class="field"><label>AVATAR</label><div class="avatar-grid">${avatars.map(a=>`<button type="button" class="tool avpick ${a===state.avatar?'active':''}" data-a="${a}">${a}</button>`).join('')}</div></div><div class="modal-actions"><button class="btn ghost" id="cancelProfile">Cancel</button><button class="btn primary" id="saveProfile">SAVE</button></div>`);$('#mx').onclick=closeModal;$('#cancelProfile').onclick=closeModal;document.querySelectorAll('.avpick').forEach(b=>b.onclick=()=>{state.avatar=b.dataset.a;document.querySelectorAll('.avpick').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#profileAvatar').textContent=state.avatar});$('#saveProfile').onclick=()=>{saveName($('#pname').value);localStorage.setItem('drawzy_avatar',state.avatar);closeModal();toast('Profile saved')}}
