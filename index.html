<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>DRAWZY — Draw. Guess. Repeat.</title>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/babysusplay/Drawzy/dbc4d277ed65d98853ba7af735eac146112dc277/index.html';
  try{
    let html=await (await fetch(source,{cache:'no-store'})).text();
    const css=`<style id="mobile-lobby-space-fix">
@media(max-width:650px){
  .lobby-grid{grid-template-rows:auto minmax(0,1fr)!important;}
  .lobby-players,.lobby-chat{min-height:250px!important;height:100%!important;}
  .lobby-players .players{max-height:none!important;}
}
</style>`;
    html=html.replace('</head>',css+'</head>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<p style="font-family:system-ui;padding:20px">DRAWZY could not load. Please refresh.</p>';
  }
})();
</script>
</head>
<body></body>
</html>
